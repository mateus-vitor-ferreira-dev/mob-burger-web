# Deploy automático do app de pedidos no Cloudflare Workers (via OpenNext).
#
# Roda a cada push na main (ou seja, a cada release develop -> main) e também
# pode ser disparado à mão em Actions > Deploy > Run workflow.
#
# Precisa de um único segredo no repositório:
#   CLOUDFLARE_API_TOKEN — token com o template "Edit Cloudflare Workers"
# O account_id vem do wrangler.jsonc; as variáveis NEXT_PUBLIC_* vêm do
# .env.production versionado; os segredos de servidor continuam no Worker.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Um deploy por vez: o que está rodando termina; um push mais novo substitui o que ainda esperava na fila
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build e deploy (produção)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://mob-burger-web.desenvolvedoracodexa.workers.dev

    env:
      # Hooks do husky não fazem sentido no CI
      HUSKY: 0
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Código quebrado não chega à produção
      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Tipos
        run: npx tsc --noEmit

      - name: Build e deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Teste de fumaça
        run: |
          url="https://mob-burger-web.desenvolvedoracodexa.workers.dev"
          for path in / /cardapio /login; do
            for attempt in 1 2 3 4 5; do
              code=$(curl -s -o /dev/null -w "%{http_code}" "$url$path")
              [ "$code" = "200" ] && break
              sleep 6
            done
            echo "$path -> $code"
            [ "$code" = "200" ] || { echo "::error::$path respondeu $code depois do deploy"; exit 1; }
          done
